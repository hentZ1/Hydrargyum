[package]
name = "hydrargyum"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.9", features = ["derive"] }
cpal = "0.18.2"
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.34"
neteq = { version = "0.9.1", default-features = false }
opus = "0.4.0"
ringbuf = "0.5.1"
rtc = { version = "0.21.0", default-features = false, features = ["crypto-ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.20"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
webrtc = "0.21.0"

[dev-dependencies]
anyhow = "1.0.104"
